# fortinet / fortigate

config system interface
    edit "port1"
        set ip 10.20.30.1 255.255.255.0
        set allowaccess ping https ssh
        set description "LAN-DEMO"
    next
end

config system admin
    edit "admin"
        set password DemoFGT#Admin2026
        set accprofile "super_admin"
    next
end

config firewall policy
    edit 10
        set name "LAN-to-WAN-DEMO"
        set srcintf "port1"
        set dstintf "wan1"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
